# CI — the full check list, on stable (no_std gates included since 0.3.0).
#
# The test step IS the parity and allocation gate: the goldens live in-repo
# (tests/goldens/), so PRIMA never builds here ("freeze then forget").
name: CI

on:
  push:
    branches: ["**"] # branches only — on a tag push, release.yml runs this via workflow_call
  pull_request:
  workflow_call: # release.yml gates publishing on this suite

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown, wasm32-wasip1, thumbv7em-none-eabihf
      - uses: bytecodealliance/actions/wasmtime/setup@v1

      # 1. Formatting.
      - run: cargo fmt --check

      # 2. Lints.
      - run: cargo clippy --all-targets --locked -- -D warnings

      # 3. Native tests — unit + parity battery (bit-exact goldens) + the
      #    zero-allocation test — plus doctests.
      - run: cargo test --all-targets --locked
      # The kernel-invocation counter is feature-gated off by default (so the shipped lib carries
      # no global state), which means --all-targets never runs it — exercise it explicitly here.
      - run: cargo test --features count-kernels --test kernel_counts --locked
      - run: cargo test --doc --locked

      # 3b. The libm parity gate: std + libm gives libm math under a std test
      #     harness, so the FULL battery — every bit-exact golden — runs against the libm
      #     backend. If any golden moves by one bit, the no_std story stops here.
      - run: cargo clippy --all-targets --features libm --locked -- -D warnings
      - run: cargo test --all-targets --features libm --locked

      # 4. wasm build gate (no JS glue).
      - run: cargo build --target wasm32-unknown-unknown --locked

      # 5. wasm run gate: the parity battery and the unit tests (the 32-bit
      #    size-overflow test among them) execute on wasm32-wasip1 under wasmtime. The --dir
      #    identity mapping preopens the workspace so the CARGO_MANIFEST_DIR-relative golden
      #    and state-dump paths baked into the test binaries resolve inside the guest.
      #    Expectation: bit-exact, same as native.
      - run: cargo test --target wasm32-wasip1 --lib --test parity_prima --locked
        env:
          CARGO_TARGET_WASM32_WASIP1_RUNNER: wasmtime run --dir ${{ github.workspace }}::${{ github.workspace }}

      # 5b. no_std build gate: a bare-metal target has no std to fall back
      #     on, so this is the proof that the crate is genuinely no_std + alloc. Compile-only;
      #     a bare target cannot run the harness (the libm parity gate above covers behaviour).
      - run: cargo build --no-default-features --features libm --target thumbv7em-none-eabihf --locked

      # 6. Bench compile check.
      - run: cargo bench --no-run --locked

      # 7. MSRV gate: the library builds, in both math backends, on the `rust-version`
      #    Cargo.toml declares. Library only — the dev-dependencies set their own MSRV.
      - run: rustup toolchain install 1.85 --profile minimal
      - run: cargo +1.85 build --locked
      - run: cargo +1.85 build --no-default-features --features libm --locked
